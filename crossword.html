<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crossword — Sam Rivera</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .crossword-page {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      .crossword-page h1 {
        font-size: 2rem;
        margin: 0 0 0.25rem;
      }

      .crossword-page .subtitle {
        color: var(--color-muted);
        margin: 0 0 2rem;
      }

      .crossword-layout {
        display: flex;
        gap: 2.5rem;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      /* Grid */
      .grid-wrap {
        flex-shrink: 0;
      }

      .crossword-grid {
        display: grid;
        grid-template-columns: repeat(13, 36px);
        grid-template-rows: repeat(13, 36px);
        gap: 2px;
        background: var(--color-ink);
        border: 2px solid var(--color-ink);
        border-radius: 4px;
        overflow: hidden;
      }

      .cell {
        background: #000;
        position: relative;
      }

      .cell.open {
        background: #fff;
      }

      .cell input {
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
        text-align: center;
        font-size: 1rem;
        font-weight: 700;
        font-family: var(--font-sans);
        text-transform: uppercase;
        background: transparent;
        color: var(--color-ink);
        cursor: pointer;
        caret-color: transparent;
        padding: 0;
        padding-top: 6px;
      }

      .cell input:focus {
        background: #d6e4ff;
      }

      .cell input.correct {
        color: #1a7f37;
        background: #d1f5d8;
      }

      .cell input.incorrect {
        color: #cf222e;
        background: #ffd8d8;
      }

      .cell-number {
        position: absolute;
        top: 2px;
        left: 2px;
        font-size: 0.52rem;
        font-weight: 600;
        line-height: 1;
        color: var(--color-ink);
        pointer-events: none;
        z-index: 1;
      }

      /* Clues */
      .clues {
        flex: 1;
        min-width: 220px;
      }

      .clues h3 {
        font-size: 1rem;
        margin: 0 0 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.8rem;
        color: var(--color-muted);
      }

      .clue-list {
        list-style: none;
        margin: 0 0 1.5rem;
        padding: 0;
      }

      .clue-list li {
        font-size: 0.9rem;
        margin-bottom: 0.35rem;
        cursor: pointer;
        border-radius: 4px;
        padding: 1px 4px;
      }

      .clue-list li:hover {
        background: var(--color-border);
      }

      .clue-list li.active {
        background: #d6e4ff;
        color: var(--color-accent);
        font-weight: 600;
      }

      .clue-list li span {
        font-weight: 700;
        margin-right: 0.4em;
      }

      /* Controls */
      .controls {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
        flex-wrap: wrap;
      }

      .btn {
        padding: 0.5rem 1.1rem;
        border-radius: 6px;
        border: 1.5px solid var(--color-border);
        font-size: 0.88rem;
        font-family: var(--font-sans);
        cursor: pointer;
        font-weight: 600;
        background: var(--color-surface);
        color: var(--color-ink);
        transition: background 0.15s;
      }

      .btn:hover {
        background: var(--color-border);
      }

      .btn--primary {
        background: var(--color-accent);
        color: #fff;
        border-color: var(--color-accent);
      }

      .btn--primary:hover {
        background: #1a55e0;
        border-color: #1a55e0;
      }

      .message {
        margin-top: 1rem;
        font-weight: 600;
        font-size: 0.95rem;
        min-height: 1.4em;
        color: #1a7f37;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 1.5rem;
        font-size: 0.88rem;
        color: var(--color-muted);
      }

      @media (max-width: 640px) {
        .crossword-grid {
          grid-template-columns: repeat(13, 28px);
          grid-template-rows: repeat(13, 28px);
        }
        .cell input { font-size: 0.8rem; padding-top: 4px; }
        .cell-number { font-size: 0.44rem; }
      }
    </style>
  </head>
  <body>
    <div class="crossword-page">
      <a class="back-link" href="index.html">&larr; Back to home</a>
      <h1>Crossword</h1>
      <p class="subtitle">A product-minded puzzle. Theme: things that matter in tech.</p>

      <div class="crossword-layout">
        <div class="grid-wrap">
          <div class="crossword-grid" id="grid"></div>
          <div class="controls">
            <button class="btn btn--primary" onclick="checkAll()">Check answers</button>
            <button class="btn" onclick="revealAll()">Reveal</button>
            <button class="btn" onclick="clearAll()">Clear</button>
          </div>
          <div class="message" id="message"></div>
        </div>

        <div class="clues">
          <h3>Across</h3>
          <ul class="clue-list" id="across-clues"></ul>
          <h3>Down</h3>
          <ul class="clue-list" id="down-clues"></ul>
        </div>
      </div>
    </div>

    <script>
      // ─── Puzzle definition ────────────────────────────────────────────────
      // 13×13 grid. "#" = black cell, letter = answer cell, " " = open/blank
      // Grid uses 0-indexed [row][col]

      const ANSWER = [
        "##ROADMAP###",
        "##O######E##",
        "##AGILE###T##",
        "##D#SPRINT#A#",
        "###I######C#",
        "PERSONA###K##",
        "###V#BACKLOG#",
        "###O#L######",
        "###T#O######",
        "###A#W######",
        "###LAUNCH###",
        "##########S#",
        "##METRIC####",
      ].map(r => r.split(""));

      // Pad shorter rows to 13
      ANSWER.forEach((row, i) => {
        while (row.length < 13) row.push("#");
      });

      const CLUES = {
        across: [
          { num: 1,  row: 0,  col: 2,  len: 7,  clue: "Strategic plan for a product's future" },
          { num: 4,  row: 2,  col: 2,  len: 5,  clue: "Iterative development methodology" },
          { num: 6,  row: 3,  col: 4,  len: 6,  clue: "Short focused work period (2 weeks typically)" },
          { num: 8,  row: 5,  col: 0,  len: 7,  clue: "Fictional user archetype for design" },
          { num: 10, row: 6,  col: 5,  len: 7,  clue: "Prioritised list of features to build" },
          { num: 13, row: 10, col: 3,  len: 6,  clue: "Go to market — ship it!" },
          { num: 14, row: 12, col: 2,  len: 6,  clue: "Measurable indicator of success" },
        ],
        down: [
          { num: 1,  row: 0,  col: 2,  len: 10, clue: "A plan showing work over time" },
          { num: 2,  row: 0,  col: 4,  len: 4,  clue: "Iterative method (abbr.)" },
          { num: 3,  row: 0,  col: 11, len: 5,  clue: "Progress milestone" },
          { num: 5,  row: 3,  col: 4,  len: 7,  clue: "Backlog item or task unit" },
          { num: 7,  row: 6,  col: 5,  len: 5,  clue: "Steady flow of value" },
          { num: 9,  row: 3,  col: 11, len: 9,  clue: "Measures of success (plural)" },
          { num: 11, row: 6,  col: 6,  len: 4,  clue: "Opposite of push, in git and feedback" },
          { num: 12, row: 10, col: 11, len: 2,  clue: "Software as a ___" },
        ],
      };

      // ─── Build grid ───────────────────────────────────────────────────────
      const ROWS = 13, COLS = 13;
      const gridEl = document.getElementById("grid");

      // Assign cell numbers
      const cellNums = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      let nextNum = 1;
      const allClues = [...CLUES.across, ...CLUES.down];

      // collect positions where numbers go
      const numberedCells = {};
      allClues.forEach(c => {
        const key = `${c.row},${c.col}`;
        if (!numberedCells[key]) numberedCells[key] = c.num;
      });

      // Render cells
      const inputs = {};
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          const ch = ANSWER[r][c];
          if (ch !== "#") {
            cell.classList.add("open");
            const key = `${r},${c}`;
            if (numberedCells[key]) {
              const num = document.createElement("div");
              num.className = "cell-number";
              num.textContent = numberedCells[key];
              cell.appendChild(num);
            }
            const inp = document.createElement("input");
            inp.type = "text";
            inp.maxLength = 1;
            inp.dataset.row = r;
            inp.dataset.col = c;
            inp.dataset.answer = ch;
            inp.addEventListener("keydown", onKeyDown);
            inp.addEventListener("input", onInput);
            inp.addEventListener("focus", onFocus);
            cell.appendChild(inp);
            inputs[key] = inp;
          }
          gridEl.appendChild(cell);
        }
      }

      // ─── Keyboard navigation ──────────────────────────────────────────────
      let direction = "across";

      function onFocus(e) {
        highlightWord(+e.target.dataset.row, +e.target.dataset.col, direction);
        highlightClue(+e.target.dataset.row, +e.target.dataset.col, direction);
      }

      function onInput(e) {
        const inp = e.target;
        inp.value = inp.value.slice(-1).toUpperCase();
        // clear check styling on edit
        inp.classList.remove("correct", "incorrect");
        if (inp.value) advance(+inp.dataset.row, +inp.dataset.col, direction);
        document.getElementById("message").textContent = "";
      }

      function onKeyDown(e) {
        const r = +e.target.dataset.row, c = +e.target.dataset.col;
        if (e.key === "ArrowRight") { e.preventDefault(); direction = "across"; focusCell(r, c+1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); direction = "across"; focusCell(r, c-1); }
        else if (e.key === "ArrowDown") { e.preventDefault(); direction = "down"; focusCell(r+1, c); }
        else if (e.key === "ArrowUp") { e.preventDefault(); direction = "down"; focusCell(r-1, c); }
        else if (e.key === "Backspace" && !e.target.value) {
          e.preventDefault();
          retreat(r, c, direction);
        } else if (e.key === "Tab") {
          e.preventDefault();
          // toggle direction
          direction = direction === "across" ? "down" : "across";
          highlightWord(r, c, direction);
          highlightClue(r, c, direction);
        }
      }

      function focusCell(r, c) {
        const inp = inputs[`${r},${c}`];
        if (inp) inp.focus();
      }

      function advance(r, c, dir) {
        const [dr, dc] = dir === "across" ? [0,1] : [1,0];
        focusCell(r+dr, c+dc);
      }

      function retreat(r, c, dir) {
        const [dr, dc] = dir === "across" ? [0,-1] : [-1,0];
        const prev = inputs[`${r+dr},${c+dc}`];
        if (prev) { prev.value = ""; prev.focus(); }
      }

      function highlightWord(r, c, dir) {
        // Clear all highlights
        Object.values(inputs).forEach(i => i.closest(".cell").style.background = "");
        // Find the word bounds
        let clue = findClue(r, c, dir);
        if (!clue) {
          dir = dir === "across" ? "down" : "across";
          clue = findClue(r, c, dir);
          if (!clue) return;
        }
        const [dr, dc] = dir === "across" ? [0,1] : [1,0];
        for (let i = 0; i < clue.len; i++) {
          const inp = inputs[`${clue.row + dr*i},${clue.col + dc*i}`];
          if (inp) inp.closest(".cell").style.background = "#e8f0ff";
        }
      }

      function findClue(r, c, dir) {
        return CLUES[dir].find(cl => {
          const [dr, dc] = dir === "across" ? [0,1] : [1,0];
          for (let i = 0; i < cl.len; i++) {
            if (cl.row + dr*i === r && cl.col + dc*i === c) return true;
          }
          return false;
        });
      }

      function highlightClue(r, c, dir) {
        document.querySelectorAll(".clue-list li").forEach(li => li.classList.remove("active"));
        const clue = findClue(r, c, dir) || findClue(r, c, dir === "across" ? "down" : "across");
        if (!clue) return;
        const li = document.querySelector(`[data-clue="${dir}-${clue.num}"]`) ||
                   document.querySelector(`[data-clue="across-${clue.num}"]`) ||
                   document.querySelector(`[data-clue="down-${clue.num}"]`);
        if (li) { li.classList.add("active"); li.scrollIntoView({ block: "nearest" }); }
      }

      // ─── Clue lists ───────────────────────────────────────────────────────
      function buildClues(dir) {
        const ul = document.getElementById(`${dir}-clues`);
        CLUES[dir].forEach(cl => {
          const li = document.createElement("li");
          li.dataset.clue = `${dir}-${cl.num}`;
          li.innerHTML = `<span>${cl.num}.</span>${cl.clue}`;
          li.addEventListener("click", () => {
            direction = dir;
            focusCell(cl.row, cl.col);
            highlightWord(cl.row, cl.col, dir);
            highlightClue(cl.row, cl.col, dir);
          });
          ul.appendChild(li);
        });
      }
      buildClues("across");
      buildClues("down");

      // ─── Check / Reveal / Clear ───────────────────────────────────────────
      function checkAll() {
        let total = 0, correct = 0;
        Object.values(inputs).forEach(inp => {
          total++;
          if (inp.value) {
            if (inp.value.toUpperCase() === inp.dataset.answer.toUpperCase()) {
              inp.classList.add("correct"); inp.classList.remove("incorrect"); correct++;
            } else {
              inp.classList.add("incorrect"); inp.classList.remove("correct");
            }
          }
        });
        const msg = document.getElementById("message");
        if (correct === total) {
          msg.textContent = "Solved! Nice work.";
          msg.style.color = "#1a7f37";
        } else {
          msg.textContent = `${correct}/${total} correct so far.`;
          msg.style.color = "#cf222e";
        }
      }

      function revealAll() {
        Object.values(inputs).forEach(inp => {
          inp.value = inp.dataset.answer.toUpperCase();
          inp.classList.add("correct"); inp.classList.remove("incorrect");
        });
        document.getElementById("message").textContent = "Revealed.";
        document.getElementById("message").style.color = "#5a5a5a";
      }

      function clearAll() {
        Object.values(inputs).forEach(inp => {
          inp.value = "";
          inp.classList.remove("correct", "incorrect");
          inp.closest(".cell").style.background = "";
        });
        document.getElementById("message").textContent = "";
      }
    </script>
  </body>
</html>
